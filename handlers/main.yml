---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - ansible_facts["system"] | lower == 'linux'
    - ansible_facts["service_mgr"] == 'systemd'

- name: Restart kiosk service
  ansible.builtin.systemd:
    name: kiosk
    state: restarted
    daemon_reload: true
  when:
    - ansible_facts["system"] | lower == 'linux'
    - ansible_facts["service_mgr"] == 'systemd'
  # Prevent errors if the systemd service file hasn't been created yet
  ignore_errors: true
